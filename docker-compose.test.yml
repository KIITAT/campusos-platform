name: campusos-verification

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: campusos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: campusos_test_only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusos"]
      interval: 2s
      timeout: 3s
      retries: 30
