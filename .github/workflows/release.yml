name: release

# The CampusOS package repository is published here.
#
# A tag produces one release holding every plugin archive plus registry.json,
# which is the index a host fetches to find out what it can install. GitHub
# Releases is the store: free, versioned, immutable once published, and already
# where the code lives. Nothing about the host depends on it being GitHub --
# the index carries absolute URLs, so an institution that cannot reach it can
# mirror the whole thing and point REGISTRY_BASE_URL somewhere else.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v
        required: true
      first_signed_release:
        description: Merge an unsigned published index once (the first signed release only)
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  # A release is built only from a commit whose CI passes (OPS-03).
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: work out the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$v" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the version must be a semantic version, without the leading v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The previous index is fetched and merged, so publishing 0.2.0 does not
      # strip 0.1.0 out from under a host that pinned it.
      #
      # Through the API, not the browser URL: a private repository answers 404
      # at releases/latest/download/... even with a token, and a merge that
      # quietly fetched nothing would drop every older version without failing.
      # A failed download must fail the release: merging nothing would drop every
      # older version from the index (NEW-26). Only "no release yet" (404) passes.
      - name: fetch the published index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>&1 >/dev/null); then
            if printf '%s' "$out" | grep -q 'HTTP 404'; then
              echo "no published release yet; this will be the first"
              exit 0
            fi
            echo "::error::could not read the latest release: $out"
            exit 1
          fi
          gh release download --repo "$GITHUB_REPOSITORY" --pattern registry.json --output dist/previous-registry.json
          gh release download --repo "$GITHUB_REPOSITORY" --pattern registry.json.sig --output dist/previous-registry.json.sig || echo "the published index has no signature"
          echo "merging $(jq '[.packages[].versions | length] | add' dist/previous-registry.json) existing versions"

      # The previous index is re-signed by this release, so it is verified
      # first: merging an index nobody checked would sign whatever was put there.
      - name: verify the published index
        env:
          CAMPUSOS_REGISTRY_SIGNING_KEY: ${{ secrets.CAMPUSOS_REGISTRY_SIGNING_KEY }}
          FIRST_SIGNED_RELEASE: ${{ inputs.first_signed_release }}
        run: |
          if [ ! -f dist/previous-registry.json ]; then exit 0; fi
          if [ -f dist/previous-registry.json.sig ]; then
            node scripts/registry-sign.mjs verify dist/previous-registry.json
          elif [ "$FIRST_SIGNED_RELEASE" = "true" ]; then
            echo "merging the unsigned published index once, as asked"
          else
            echo "::error::the published registry.json is unsigned; run this workflow by hand with first_signed_release=true once"
            exit 1
          fi

      - name: pack
        env:
          PLUGIN_VERSION: ${{ steps.v.outputs.version }}
          # Never used: packing constructs no pool, and the stubbed driver
          # refuses if anything tries.
          DATABASE_URL: postgresql://pack:pack@127.0.0.1:1/pack
          AUTH_SECRET: packing-only-never-used-at-runtime
        run: |
          pnpm pack:plugins
          pnpm pack:core
          mkdir -p dist
          if [ -f dist/previous-registry.json ]; then
            cp dist/previous-registry.json dist/plugins/previous-registry.json
          fi
          pnpm registry:index

      # An archive that cannot be loaded from a temporary directory by plain
      # Node is not publishable, whatever the tests said about the workspace.
      - run: node scripts/verify-archives.mjs

      - name: sign the index
        env:
          CAMPUSOS_REGISTRY_SIGNING_KEY: ${{ secrets.CAMPUSOS_REGISTRY_SIGNING_KEY }}
        run: |
          node scripts/registry-sign.mjs sign dist/registry/registry.json --require-key
          node scripts/registry-sign.mjs verify dist/registry/registry.json

      - name: publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: CampusOS ${{ steps.v.outputs.version }}
          body: |
            Plugin archives for the CampusOS package repository.

            A host installs these from its admin portal; nothing here is an npm
            package and nothing needs a package manager at the institution.
            `registry.json` is the index, and each entry carries the sha256 the
            host verifies before it will install. `registry.json.sig` is its
            Ed25519 signature; a host refuses an index without one from a key it
            trusts.
          # dist/registry is the release laid out as it is served: every
          # archive and the index in one flat directory, which is also exactly
          # what an institution copies to mirror the repository.
          files: dist/registry/*
          fail_on_unmatched_files: true
